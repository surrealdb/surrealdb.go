name: test
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest 3.x release (the docker `v3` tag follows the newest 3.x)
          - surrealdb-version: 'v3'
            go-version: '1.25.0'
            connection-type: 'ws'
            surrealdb-url: 'ws://localhost:8000/rpc'
          - surrealdb-version: 'v3'
            go-version: '1.25.0'
            connection-type: 'http'
            surrealdb-url: 'http://localhost:8000'
          # Latest 3.x, gws
          - surrealdb-version: 'v3'
            go-version: '1.25.0'
            connection-type: 'ws'
            surrealdb-url: 'ws://localhost:8000/rpc'
            surrealdb-connection-impl: 'gws'
          # Latest 3.x, gorilla/websocket, fxamackercbor (legacy)
          - surrealdb-version: 'v3'
            go-version: '1.25.0'
            connection-type: 'ws'
            surrealdb-url: 'ws://localhost:8000/rpc'
            surrealdb-cbor-impl: 'fxamackercbor'
          # Latest 3.x, gorilla/websocket, reconnection
          - surrealdb-version: 'v3'
            go-version: '1.25.0'
            connection-type: 'ws'
            surrealdb-url: 'ws://localhost:8000/rpc'
            surrealdb-reconnection-check-interval: '1s'
          # Latest 3.x with the oldest supported Go
          - surrealdb-version: 'v3'
            go-version: '1.24.6'
            connection-type: 'ws'
            surrealdb-url: 'ws://localhost:8000/rpc'
          # Nightly: the next release line (4.0). Reported, but does not block a merge.
          - surrealdb-version: 'nightly'
            go-version: '1.25.0'
            connection-type: 'ws'
            surrealdb-url: 'ws://localhost:8000/rpc'
            experimental: true
          - surrealdb-version: 'nightly'
            go-version: '1.25.0'
            connection-type: 'http'
            surrealdb-url: 'http://localhost:8000'
            experimental: true
          # Oldest 3.x
          - surrealdb-version: 'v3.0.1'
            go-version: '1.25.0'
            connection-type: 'ws'
            surrealdb-url: 'ws://localhost:8000/rpc'
          - surrealdb-version: 'v3.0.1'
            go-version: '1.25.0'
            connection-type: 'http'
            surrealdb-url: 'http://localhost:8000'
            # SurrealDB 3.0.x keeps one shared session for all HTTP /rpc requests, so
            # concurrent requests can run in each other's namespace and database
            # (fixed in 3.1.0). Run the test packages one at a time.
            go-test-flags: '-p 1'
          # 2.x
          - surrealdb-version: 'v2.6.0'
            go-version: '1.25.0'
            connection-type: 'ws'
            surrealdb-url: 'ws://localhost:8000/rpc'
          - surrealdb-version: 'v2.6.0'
            go-version: '1.25.0'
            connection-type: 'http'
            surrealdb-url: 'http://localhost:8000'
          - surrealdb-version: 'v2.6.0'
            go-version: '1.25.0'
            connection-type: 'ws'
            surrealdb-url: 'ws://localhost:8000/rpc'
            surrealdb-cbor-impl: 'fxamackercbor'
    name: test (${{ matrix.surrealdb-version }}, ${{ matrix.connection-type }}${{ matrix.surrealdb-connection-impl && format(', {0}', matrix.surrealdb-connection-impl) || '' }}${{ matrix.surrealdb-cbor-impl && format(', {0}', matrix.surrealdb-cbor-impl) || '' }}${{ matrix.surrealdb-reconnection-check-interval && ', reconnect' || '' }}, go ${{ matrix.go-version }})
    continue-on-error: ${{ matrix.experimental == true }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 surrealdb/surrealdb:${{ matrix.surrealdb-version }} start --user root --pass root
          docker run --rm surrealdb/surrealdb:${{ matrix.surrealdb-version }} version
          # Wait for SurrealDB to be ready
          for i in {1..30}; do
            if curl -f http://localhost:8000/health 2>/dev/null; then
              echo "SurrealDB is ready"
              break
            fi
            echo "Waiting for SurrealDB to start... ($i/30)"
            sleep 2
          done
      - name: Test ${{ matrix.connection-type }} connection
        run: go test -v -cover -race $GO_TEST_FLAGS ./...
        env:
          SURREALDB_URL: ${{ matrix.surrealdb-url }}
          SURREALDB_CONNECTION_IMPL: ${{ matrix.surrealdb-connection-impl }}
          SURREALDB_CBOR_IMPL: ${{ matrix.surrealdb-cbor-impl }}
          SURREALDB_RECONNECTION_CHECK_INTERVAL: ${{ matrix.surrealdb-reconnection-check-interval }}
          GO_TEST_FLAGS: ${{ matrix.go-test-flags }}

  surrealnote-e2e:
    name: SurrealNote E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 'stable'
          check-latest: true
          cache-dependency-path: contrib/surrealnote/go.sum

      # Start SurrealDB
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 surrealdb/surrealdb:v2.6.0 start --user root --pass root
          # Wait for SurrealDB to be ready
          for i in {1..30}; do
            if curl -f http://localhost:8000/health 2>/dev/null; then
              echo "SurrealDB is ready"
              break
            fi
            echo "Waiting for SurrealDB to start... ($i/30)"
            sleep 2
          done

      # Run E2E migration test using Makefile
      - name: Run SurrealNote E2E Migration Test
        run: |
          cd contrib/surrealnote
          # The Makefile will handle PostgreSQL start/stop automatically
          go test -v -race -timeout 10m -run TestE2E_migrationFlow ./...
        env:
          SURREALDB_URL: ws://localhost:8000/rpc

      # Clean up containers
      - name: Clean up containers
        if: always()
        run: |
          cd contrib/surrealnote
          make postgres-remove || true
          docker stop surrealdb || true
          docker rm surrealdb || true

  surrealcbor-timezone:
    name: surrealcbor timezone tests (TZ=${{ matrix.timezone }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Asia/Jerusalem]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 'stable'
          check-latest: true
          cache-dependency-path: go.sum
      - name: Run datetime decode tests
        run: |
          go test -v -race ./surrealcbor/... \
            -run 'TestDecode_(array|map)_withAllSupportedTypes|TestDecode_map_structwithAllSupportedTypes'
        env:
          TZ: ${{ matrix.timezone }}
